#cloud-config
# ⚠️  Ne pas éditer directement. Généré par ./generate-cloud-init.sh
#     Template : cloud-init.tpl.yaml

package_update: true
package_upgrade: true

# Le module OTel n'existe dans aucune distribution : nginx **et** le module
# viennent de chez nginx.org, la paire étant construite ensemble. `$RELEASE` est
# substitué par cloud-init, pas par le templating.
# Nom de code non servi par le dépôt stable ? Passer à /packages/mainline/ubuntu.
apt:
  sources:
    nginx-org:
      source: 'deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/ubuntu $RELEASE nginx'
      # Empreinte de la clé de signature de nginx.org. À vérifier sur
      # https://blog.nginx.org/blog/updating-pgp-key-for-nginx-software : la page
      # linux_packages.html affiche encore l'ancienne, expirée en juin 2024.
      keyid: 8540A6F18833A80E9C1653A42FD21310B49F6B46
      keyserver: keyserver.ubuntu.com

packages:
  - nginx
  - nginx-module-otel
  - certbot
  - python3-certbot-nginx
  - gettext-base
  - jq

write_files:
  - path: /etc/nginx/deploy.env
    permissions: '0600'
    content: |
      DOMAIN=__DOMAIN__
      UPSTREAM=__UPSTREAM__
      ENVIRONMENT=__ENVIRONMENT__
      REPO=__REPO__
      TEMPLATE_REF=__TEMPLATE_REF__

  - path: /etc/systemd/system/nginx.service.d/override.conf
    permissions: '0644'
    content: |
      [Unit]
      StartLimitIntervalSec=3600
      StartLimitBurst=360

      [Service]
      Restart=on-failure
      RestartSec=10s
      TimeoutStartSec=60s

  - path: /etc/otelcol-contrib/otelcol-contrib.env
    permissions: '0600'
    content: |
      POSTHOG_PROJECT_TOKEN=__POSTHOG_PROJECT_TOKEN__
      ENVIRONMENT=__ENVIRONMENT__

runcmd:
  - mkdir -p /var/cache/nginx /var/lib/nginx-config
  # Rétention des logs nginx : 2 jours au lieu de 14. On ne touche qu'au nombre
  # de rotations du fichier livré par Ubuntu (daily, compress, postrotate… sont
  # déjà corrects).
  - sed -i 's/rotate 14/rotate 2/' /etc/logrotate.d/nginx
  - chown -R www-data:www-data /var/cache/nginx
  # Le vhost vit dans `conf.d/` : la seule disposition incluse par le
  # `nginx.conf` de nginx.org, celui qui porte le module OTel. On retire le
  # serveur par défaut qu'il livre.
  - rm -f /etc/nginx/conf.d/default.conf
  - |
    ufw allow 22/tcp
    ufw allow 80/tcp
    ufw allow 443/tcp
    ufw --force enable

  # ── Module OTel d'nginx (traces) ────────────────────────────────────────
  # Le paquet installe le `.so`, mais l'activation se fait une seule fois : un
  # second `load_module` du même fichier ferait échouer nginx au démarrage.
  # Sans le module, le glob inclus reste vide et nginx demeure valide.
  - |
    set -euo pipefail
    mod=/etc/nginx/modules/ngx_otel_module.so
    [ -f "$mod" ] || { echo "$mod absent : paquet nginx-module-otel manquant ?" >&2; exit 1; }
    # Le `nginx.conf` de nginx.org n'inclut pas `modules-enabled`, contrairement à
    # celui d'Ubuntu : `load_module` va donc dans le contexte principal.
    grep -qs ngx_otel_module /etc/nginx/nginx.conf || \
      sed -i '1i load_module modules/ngx_otel_module.so;' /etc/nginx/nginx.conf
    mkdir -p /etc/nginx/otel-enabled
    curl -fsSL \
      "https://raw.githubusercontent.com/__REPO__/refs/heads/__TEMPLATE_REF__/infra/nginx/otel.conf" \
      -o /etc/nginx/otel-enabled/otel.conf

  # ── OpenTelemetry Collector (nginx → PostHog Logs) ──────────────────────
  # install-otelcol.sh est idempotent : cloud-init l'utilise au first boot,
  # et on peut relancer le même script en SSH pour (ré)installer/upgrader.
  # Version épinglée : __OTELCOL_VERSION__ (bump dans generate-cloud-init.sh).
  - |
    set -euo pipefail
    GH_RAW="raw.githubusercontent.com"
    RAW="https://${GH_RAW}/__REPO__/refs/heads/__TEMPLATE_REF__/infra/nginx"
    curl -fsSL "$RAW/install-otelcol.sh" \
      -o /usr/local/bin/install-otelcol.sh
    chmod +x /usr/local/bin/install-otelcol.sh
    NGC_REF="__TEMPLATE_REF__" \
      /usr/local/bin/install-otelcol.sh "__OTELCOL_VERSION__"

  # ── Pull du pull script + units systemd nginx ───────────────────────────
  - |
    GH_RAW="raw.githubusercontent.com"
    RAW="https://${GH_RAW}/__REPO__/refs/heads/__TEMPLATE_REF__/infra/nginx"
    curl -fsSL "$RAW/pull-config.sh" \
      -o /usr/local/bin/nginx-config-pull.sh
    chmod +x /usr/local/bin/nginx-config-pull.sh
    curl -fsSL "$RAW/nginx-config-pull.service" \
      -o /etc/systemd/system/nginx-config-pull.service
    curl -fsSL "$RAW/nginx-config-pull.timer" \
      -o /etc/systemd/system/nginx-config-pull.timer
  - systemctl daemon-reload
  - systemctl enable --now nginx-config-pull.timer
  - /usr/local/bin/nginx-config-pull.sh
  - echo "✅ Nginx config pulled. Nginx à l'arrêt — certificat SSL manquant."
  - echo "   certbot certonly --manual --preferred-challenges dns"
  - echo "   -d __DOMAIN__ -d www.__DOMAIN__"

# ----------------------------------------------------------------------------
# OpenTelemetry Collector — nginx → PostHog Logs
#
# Taille /var/log/nginx/{access,error}.log et les exporte vers PostHog Logs
# (endpoint OTLP HTTP). Déployé sur l'instance Scaleway par cloud-init,
# service systemd `otelcol-contrib` (user `otelcol-contrib`).
#
# Résilience : les offsets de lecture (`file_storage`) et la file d'export
# (persistée sur disque) survivent à un redémarrage — reprise exacte après
# rotation de logs (ni trou ni doublon), et aucune perte si PostHog est
# injoignable. nginx n'a aucune dépendance vers le collecteur.
#
# Les variables ${env:...} sont résolues au démarrage depuis l'environnement
# chargé par systemd (/etc/otelcol-contrib/otelcol-contrib.env, cf.
# cloud-init.tpl.yaml).
# ----------------------------------------------------------------------------

extensions:
  health_check:
  file_storage:
    directory: /var/lib/otelcol-contrib

receivers:
  # Traces du module OTel d'nginx : OTLP/gRPC, en local uniquement.
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

  # error.log : format texte d'nginx OSS. Le JSON (`error_log json`) est
  # réservé à NGINX Plus. Le préfixe est stable :
  #   YYYY/MM/DD HH:MM:SS [level] pid#tid: message
  #   ex. 2024/09/10 11:16:00 [error] 1234#1234: *567 upstream timed out
  # La regex extrait date/heure + niveau ; le message reste en `body` (conservé
  # pour l'analyse, contrairement à l'access log).
  filelog/error:
    include: [/var/log/nginx/error.log]
    start_at: end
    include_file_path: true
    storage: file_storage
    attributes:
      'event.name': nginx.error
    operators:
      # Emails, IP client et query du referrer masqués avant parsing.
      - type: regex_replace
        field: body
        regex: '[\w.+-]+@[\w.-]+'
        replace_with: '[email]'
      - type: regex_replace
        field: body
        regex: 'client:? [0-9a-fA-F:.]+'
        replace_with: 'client [ip]'
      - type: regex_replace
        field: body
        regex: 'referrer: "([^"?]*)\?[^"]*"'
        replace_with: 'referrer: "$${1}"'
      # Préfixe fixe : `time [level] pid#tid: *connection`.
      - type: regex_parser
        regex: >-
          ^(?P<time>\S+ \S+) \[(?P<sev>[a-z]+)\] (?P<pid>\d+)#(?P<tid>\d+):
          \*(?P<connection>\d+)
        timestamp:
          parse_from: attributes.time
          layout_type: strptime
          layout: '%Y/%m/%d %H:%M:%S'
        severity:
          parse_from: attributes.sev
          mapping:
            debug: debug
            info: info
            notice: info
            warn: warn
            error: error
            crit: fatal
            alert: fatal
            emerg: fatal
      # Contexte de requête (optionnel selon le type d'erreur). On ancre sur les
      # libellés (pas la position). `client`/`referrer` exclus : PII.
      - type: regex_parser
        regex: 'server: (?P<server>[^,]+)'
        on_error: send
      - type: regex_parser
        regex: 'request: "(?P<request>[^"]*)"'
        on_error: send
      - type: regex_parser
        regex: 'upstream: "(?P<upstream>[^"]*)"'
        on_error: send
      - type: regex_parser
        regex: 'host: "(?P<host>[^"]*)"'
        on_error: send

processors:
  resource/nginx:
    attributes:
      - key: service.name
        value: nginx
        action: upsert
      # `deployment.environment.name` is the key behind PostHog Logs'
      # Environment facet. The value matches the app's `APP_ENV`
      # (`production`, `preprod`) so one filter covers the three runtimes.
      - key: deployment.environment.name
        value: ${env:ENVIRONMENT}
        action: upsert

  # Le module émet la sémantique HTTP d'avant 1.23 ; on la ramène aux noms
  # actuels, ceux du `log_format`, pour qu'une requête vaille sur les deux
  # pipelines. `where != nil` : une source absente supprimerait la cible.
  transform/nginx-spans:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'set(span.attributes["http.request.method"], span.attributes["http.method"]) where span.attributes["http.method"] != nil'
          - 'delete_key(span.attributes, "http.method")'
          - 'set(span.attributes["http.response.status_code"], span.attributes["http.status_code"]) where span.attributes["http.status_code"] != nil'
          - 'delete_key(span.attributes, "http.status_code")'
          - 'set(span.attributes["url.scheme"], span.attributes["http.scheme"]) where span.attributes["http.scheme"] != nil'
          - 'delete_key(span.attributes, "http.scheme")'
          - 'set(span.attributes["user_agent.original"], span.attributes["http.user_agent"]) where span.attributes["http.user_agent"] != nil'
          - 'delete_key(span.attributes, "http.user_agent")'
          - 'set(span.attributes["http.request.body.size"], span.attributes["http.request_content_length"]) where span.attributes["http.request_content_length"] != nil'
          - 'delete_key(span.attributes, "http.request_content_length")'
          - 'set(span.attributes["http.response.body.size"], span.attributes["http.response_content_length"]) where span.attributes["http.response_content_length"] != nil'
          - 'delete_key(span.attributes, "http.response_content_length")'
          - 'set(span.attributes["server.address"], span.attributes["net.host.name"]) where span.attributes["net.host.name"] != nil'
          - 'delete_key(span.attributes, "net.host.name")'
          - 'set(span.attributes["server.port"], span.attributes["net.host.port"]) where span.attributes["net.host.port"] != nil'
          - 'delete_key(span.attributes, "net.host.port")'
          - 'set(span.attributes["network.protocol.version"], span.attributes["http.flavor"]) where span.attributes["http.flavor"] != nil'
          - 'delete_key(span.attributes, "http.flavor")'
          # "2.0" → "2" : la valeur de `log_format`, pas celle du module.
          - 'replace_pattern(span.attributes["network.protocol.version"], "[.]0$", "")'
          - 'set(span.attributes["url.path"], span.attributes["http.target"]) where span.attributes["http.target"] != nil'
          - 'replace_pattern(span.attributes["url.path"], "[?].*$", "")'
          - 'set(span.attributes["url.query"], span.attributes["http.target"]) where IsMatch(span.attributes["http.target"], "[?]")'
          - 'replace_pattern(span.attributes["url.query"], "^[^?]*[?]", "")'
          # Les emails ne doivent pas sortir : même masque que l'ancienne chaîne
          # d'access log, sur les deux champs qui peuvent en porter.
          - 'replace_pattern(span.attributes["url.query"], "[\\w.+-]+@[\\w.-]+", "[email]")'
          - 'replace_pattern(span.attributes["url.path"], "[\\w.+-]+@[\\w.-]+", "[email]")'
          - 'delete_key(span.attributes, "http.target")'
          # IP du visiteur : absente du format de log, elle ne doit pas entrer
          # par les spans.
          - 'delete_key(span.attributes, "net.sock.peer.addr")'
          - 'delete_key(span.attributes, "net.sock.peer.port")'

  batch:
    send_batch_size: 1000
    timeout: 5s

  # `EventName` est un champ du LogRecord, que stanza ne sait pas écrire :
  # chaque receiver pose l'attribut semconv `event.name`, promu ici en champ
  # puis retiré (il ne doit pas partir dans le volume).
  transform/event-name:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - 'set(log.event_name, log.attributes["event.name"])'
          - 'delete_key(log.attributes, "event.name")'

exporters:
  otlphttp/posthog:
    # Base OTLP : l'exporter ajoute /v1/logs. EU (US : us.i.posthog.com/i)
    endpoint: https://eu.i.posthog.com/i
    headers:
      Authorization: Bearer ${env:POSTHOG_PROJECT_TOKEN}
    # File d'export persistée sur disque : survit à un redémarrage.
    sending_queue:
      storage: file_storage

service:
  extensions: [health_check, file_storage]
  pipelines:
    logs/nginx:
      receivers: [filelog/error]
      processors: [resource/nginx, transform/event-name, batch]
      exporters: [otlphttp/posthog]
    # Le mème exporter ajoute `/v1/traces` pour cette pipeline.
    traces/nginx:
      receivers: [otlp]
      processors: [resource/nginx, transform/nginx-spans, batch]
      exporters: [otlphttp/posthog]

# Triggered by the model repository (incubateur-ademe/nosgestesclimat) after a
# manual release (workflow_dispatch): runs the model update script
# (.github/scripts/update-model-version.mjs) and opens a PR bumping the
# @incubateur-ademe/nosgestesclimat dependency.
#
# The model's packaging workflow only sends a repository_dispatch event
# (event_type: model-release) with the released version as client_payload; all
# the dependency update logic lives here, in the app.

name: Common / update model

on:
  push:
    branches:
      - chore/improve-model-release-workflow_NGC-3768

permissions:
  contents: write
  pull-requests: write

jobs:
  open_update_pr:
    name: Open model update PR
    runs-on: ubuntu-latest
    env:
      NEW_VERSION: '4.14.3'
    steps:
      # persist-credentials: false prevents the "Duplicate header: Authorization"
      # error: actions/checkout would otherwise persist the GITHUB_TOKEN in the
      # git config, which clashes with the GitHub App token used by
      # create-pull-request to push the branch.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: chore/improve-model-release-workflow_NGC-3768
          persist-credentials: false

      # GITHUB_TOKEN is scoped to this repository but would not trigger the
      # repository's workflows, so we generate a temporary GitHub App token to
      # open the PR (so CI runs on it, dependabot-style).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MODEL_BOT_APP_ID }}
          private-key: ${{ secrets.MODEL_BOT_APP_PRIVATE_KEY }}
          owner: incubateur-ademe
          repositories: nosgestesclimat-app

      - name: Update dependency version
        run: node .github/scripts/update-model-version.mjs
        env:
          NEW_VERSION: ${{ env.NEW_VERSION }}

      # Reconcile the lockfile with the bumped package.json, otherwise the
      # app's CI (pnpm install --frozen-lockfile) would fail on the PR.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: './package.json'
          cache: 'pnpm'

      # The package has just been published: retry briefly in case the npm
      # registry has not propagated the new version yet.
      - name: Update lockfile
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm install --lockfile-only; then
              exit 0
            fi
            echo "npm not ready yet, retry $attempt/5..."
            sleep 15
          done
          exit 1

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update-model/v${{ env.NEW_VERSION }}
          title: 'chore(deps): update @incubateur-ademe/nosgestesclimat to v${{ env.NEW_VERSION }}'
          commit-message: 'chore(deps): update @incubateur-ademe/nosgestesclimat to v${{ env.NEW_VERSION }}'
          body: |
            ## Summary

            Opened automatically after the release of [`@incubateur-ademe/nosgestesclimat` v${{ env.NEW_VERSION }}](https://github.com/incubateur-ademe/nosgestesclimat/releases/tag/v${{ env.NEW_VERSION }}).

            This PR updates `@incubateur-ademe/nosgestesclimat` → `v${{ env.NEW_VERSION }}` in:
            - `packages/core/package.json`
            - `apps/server/package.json`
            - `apps/site/package.json`

            and reconciles `pnpm-lock.yaml` with the new version.

            _Generated by the `Update model` workflow of this repository, triggered by a `repository_dispatch` from the model repository._
          labels: dependencies
          delete-branch: true

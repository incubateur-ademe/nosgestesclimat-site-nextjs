name: E2E

on:
  workflow_call:
    inputs:
      site_url:
        type: string
        description: 'URL of the site to test'
        required: true
      mailbox:
        type: string
        description: 'Mailbox adapter: stub (local) or brevo (preprod gate)'
        required: false
        default: brevo
      email_domain:
        type: string
        description: 'Email domain used for test accounts'
        required: false
        default: e2e.test

    secrets:
      FGP_BREVO_KEY:
        required: false
        description: 'FGP key (read-scoped) for Brevo transactional email logs'

env:
  NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url }}

jobs:
  # Each e2e-tests job generates its own E2E state through the `global setup`
  # Playwright project (a dependency of the Chrome/Firefox projects).
  # This guarantees the sessions baked into the states are always fresh, even
  # when a job is re-run hours later. Previously, the states were produced once
  # by a shared `setup` job and reused by both browser jobs: once the session
  # JWT (20-min TTL) expired, re-runs made every authenticated test fail.
  e2e-tests:
    environment:
      name: Test E2E
      deployment: false

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Chrome
            browser: chromium
          - project: Firefox
            browser: firefox
          # - project: Mobile Safari
          #   browser: webkit
    runs-on: ubuntu-latest
    name: ${{ matrix.project }}
    defaults:
      run:
        working-directory: ./apps/e2e

    steps:
      - uses: actions/checkout@v6

      - name: Setup Playwright and App
        uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ matrix.browser }}

      # The `global setup` Playwright project runs in Desktop Chrome.
      - name: Install Chromium for E2E state generation
        if: ${{ matrix.browser != 'chromium' }}
        run: pnpm playwright install chromium

      - name: Run E2E tests (${{ matrix.project }})
        env:
          E2E_MAILBOX: ${{ inputs.mailbox }}
          E2E_MAILBOX_URL: ${{ vars.FGP_BREVO_URL }}
          FGP_BREVO_KEY: ${{ secrets.FGP_BREVO_KEY }}
          E2E_TEST_EMAIL_DOMAIN: ${{ inputs.email_domain }}
        run: pnpm playwright test --project="${{ matrix.project }}"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.project }}
          path: apps/e2e/blob-report
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    name: Merge reports
    defaults:
      run:
        working-directory: ./apps/e2e

    steps:
      - uses: actions/checkout@v6

      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          path: apps/e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30

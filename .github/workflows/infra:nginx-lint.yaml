name: Nginx config lint

on:
  pull_request:
    paths:
      - 'infra/nginx/**'
  push:
    branches: [main]
    paths:
      - 'infra/nginx/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate nginx.conf.tpl syntax
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Install nginx with the OTel module, and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg gettext-base
          curl -fsSL https://nginx.org/keys/nginx_signing.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/ubuntu $VERSION_CODENAME nginx" \
            | sudo tee /etc/apt/sources.list.d/nginx.list
          sudo apt-get update
          sudo apt-get install -y nginx nginx-module-otel
          ls /etc/nginx/modules/ngx_otel_module.so
          grep -rqs ngx_otel_module /etc/nginx/modules-enabled/ || \
            echo 'load_module modules/ngx_otel_module.so;' \
              | sudo tee /etc/nginx/modules-enabled/50-mod-otel.conf

      - name: Render template with dummy values
        run: |
          mkdir -p /tmp/nginx-test
          DOMAIN=example.com UPSTREAM=example.com \
            envsubst '${DOMAIN} ${UPSTREAM}' \
            < infra/nginx/nginx.conf.tpl \
            > /tmp/nginx-test/site.conf

      - name: Create dummy SSL certs
        run: |
          sudo mkdir -p /etc/letsencrypt/live/example.com
          sudo openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /etc/letsencrypt/live/example.com/privkey.pem \
            -out /etc/letsencrypt/live/example.com/fullchain.pem \
            -days 1 -subj "/CN=localhost" 2>/dev/null

      - name: Validate nginx config
        run: |
          cat > /tmp/nginx-test/nginx.conf <<'EOF'
          include /etc/nginx/modules-enabled/*.conf;
          events {}
          http {
              include /tmp/nginx-test/site.conf;
          }
          EOF
          sudo nginx -t -c /tmp/nginx-test/nginx.conf
